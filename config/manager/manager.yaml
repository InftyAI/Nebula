apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: nebula
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: nebula
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: nebula
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: nebula
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        # Matches the image's USER (see Dockerfile). Required for the SandD signing key:
        # kubelet writes projected Secret files owned by root, and only fsGroup makes it
        # chown the volume to a group this non-root process is in — without it the key
        # has to be world-readable inside the container to be readable at all.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        env:
          # Point the price catalog at the mounted ConfigMap so prices can be
          # edited live (kubectl edit configmap nebula-catalog) without a
          # rebuild. If unset/absent, the manager falls back to the CSVs
          # embedded in the binary.
          - name: NEBULA_CATALOG_DIR
            value: /etc/nebula/catalog
          # The namespace the manager runs in, needed by the webhook cert rotator
          # (pkg/cert): it scopes both the cert Secret and the cert's DNS name
          # (<service>.<namespace>.svc). Projected via fieldRef rather than hardcoded
          # so an install into a non-default namespace still gets a cert the API
          # server accepts.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # The address each virtual node advertises as its kubelet endpoint, which is
          # what the API server dials to proxy a `kubectl exec` into this process (see
          # pkg/vnode/kubelet.go). It must be the routable pod IP: a Pod can hold
          # several addresses and only the cluster network's own is reachable, so this
          # is taken from the downward API rather than discovered from the interfaces.
          #
          # Without it the virtual nodes advertise no usable address and exec fails to
          # connect — everything else about the manager works unchanged.
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          # SandD is OFF by default, and THIS env var is the single switch that turns
          # it on: SANDD_SIGNING_KEY_PATH gates daemon-token minting AND starts the
          # embedded controller daemons dial into (see setupSandD in cmd/main.go).
          # Uncomment BOTH of these after creating the key Secret with
          # hack/gen-signing-key.sh and applying the Service (config/sandd):
          #
          #   - name: SANDD_SIGNING_KEY_PATH
          #     value: /etc/nebula/sandd/signing.pem
          #   - name: SANDD_EXTERNAL_HOST
          #     value: sandd.example.com
          #
          # SANDD_EXTERNAL_HOST is REQUIRED once the key path is set, and the manager
          # refuses to start without it rather than defaulting. It is the externally
          # reachable address of THIS manager's dial-in port — the edge in front of it
          # (see config/sandd/ingress.yaml), which must be the SAME host you put in that
          # Ingress. It cannot be derived: daemons run on NeoCloud instances that are
          # not on the cluster network, so the manager's in-cluster Service name is
          # neither resolvable nor routable from them, and any address this process
          # could invent would be one no daemon can dial. Accepted as a bare host, a
          # host:port, or a full wss:// URL; a bare host becomes
          # wss://<host>/ws (TLS by default — the token is a bearer secret).
          #
          # It is the ENV VAR, not the Secret's presence, that flips the feature. The
          # volume below is optional, so an absent Secret yields an empty directory,
          # not a scheduling failure — and if the path were set unconditionally the
          # manager would crashloop on every install that has no key. With the switch
          # here instead: unset means off and provisioning is untouched, while set means
          # a missing or malformed key is FATAL at startup (setupSandD) rather than
          # a per-Provision error, because every instance launched without a token is
          # one whose daemon can never dial in and which bills until someone notices.
          # A missing SANDD_EXTERNAL_HOST is fatal for exactly the same reason.
          #
          # Optional companions (all defaulted in cmd/main.go): SANDD_SIGNING_KID,
          # SANDD_TOKEN_ISSUER, SANDD_TOKEN_TTL. The signer and the verifier are now the
          # same process, so these cannot disagree with each other — they only need to
          # match any verifier you run OUTSIDE the cluster.
        envFrom:
          # Provider credentials live in a per-provider Secret, one secretRef per
          # provider — NOT a single shared secret. This matches the "creds-absent →
          # skip that provider, not fatal" model (see registerProviders): each
          # secretRef is independently optional=true, so configuring Modal but not
          # RunPod just skips RunPod. It also isolates rotation and RBAC per
          # provider. Providers namespace their env vars (MODAL_TOKEN_ID,
          # RUNPOD_API_KEY, ...), so the merged environment never collides.
          #
          # The Modal SDK reads MODAL_TOKEN_ID / MODAL_TOKEN_SECRET from the environment.
          - secretRef:
              name: nebula-modal-credentials
              optional: true
          # AWS credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), read by
          # the SDK's default chain. optional=true so an absent Secret is fine —
          # in production this is the norm: prefer IRSA / instance role and skip
          # this Secret entirely. There is no non-secret AWS env: regions come from
          # the NodePool, so this Secret is the ONLY AWS config here.
          - secretRef:
              name: nebula-aws-credentials
              optional: true
          # Add one secretRef per provider as adapters land, e.g.:
          # - secretRef:
          #     name: nebula-runpod-credentials
          #     optional: true
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
          - name: catalog
            mountPath: /etc/nebula/catalog
            readOnly: true
          # The SandD JWT signing key. Mounted unconditionally (the volume is optional,
          # so this is an empty dir when the Secret is absent) while the FEATURE is
          # gated by SANDD_SIGNING_KEY_PATH above — that way enabling SandD is a
          # one-line env change, not a manifest edit that also has to add a volume.
          - name: sandd-signing-key
            mountPath: /etc/nebula/sandd
            readOnly: true
      volumes:
        - name: catalog
          configMap:
            # Unprefixed on purpose: config/default's namePrefix rewrites this
            # reference to the generated "nebula-catalog" ConfigMap. optional so
            # the manager still starts (embedded-CSV fallback) if it's absent.
            name: catalog
            optional: true
        - name: sandd-signing-key
          secret:
            # NOT rewritten by config/default's namePrefix, unlike the catalog volume
            # above: kustomize only rewrites references to resources IT manages, and
            # this Secret is created out-of-band by hack/gen-signing-key.sh. So the
            # name here must match that script's SECRET default literally — verified by
            # rendering `kustomize build config/default`, where it stays unprefixed.
            secretName: sandd-signing-key
            # optional so the manager starts on an install that never enabled SandD.
            # A cluster WITH the feature on fails loudly instead: the env var is set,
            # the file is missing, and setupSandD exits non-zero at startup.
            optional: true
            # 0440, GROUP-readable, paired with fsGroup: 65532 on the pod. The key is the
            # crown jewel — it can mint a token for ANY daemon, so unlike a leaked token
            # (bounded by sub/aud/exp) its compromise is unbounded — but 0400 does not
            # work here and is not tighter in practice: kubelet writes projected Secret
            # files owned by root, the manager runs as 65532 (see Dockerfile), so
            # owner-only meant the manager could not read its OWN key and exited with
            # "permission denied" at startup.
            #
            # fsGroup makes kubelet chown the volume to that group, so 0440 grants exactly
            # one reader — uid 65532, the manager — and nothing wider. Raising this to
            # 0444 would make the key world-readable inside the container instead, which is
            # the change to avoid.
            defaultMode: 0440
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
