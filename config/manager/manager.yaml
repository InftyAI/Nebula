apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: nebula
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: nebula
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: nebula
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: nebula
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        imagePullPolicy: IfNotPresent
        env:
          # Point the price catalog at the mounted ConfigMap so prices can be
          # edited live (kubectl edit configmap nebula-catalog) without a
          # rebuild. If unset/absent, the manager falls back to the CSVs
          # embedded in the binary.
          - name: NEBULA_CATALOG_DIR
            value: /etc/nebula/catalog
          # The namespace the manager runs in, needed by the webhook cert rotator
          # (pkg/cert): it scopes both the cert Secret and the cert's DNS name
          # (<service>.<namespace>.svc). Projected via fieldRef rather than hardcoded
          # so an install into a non-default namespace still gets a cert the API
          # server accepts.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # What the virtual nodes advertise as their kubelet endpoint, which is what
          # makes `kubectl logs` work — the API server proxies logs there rather than
          # reading them from etcd (see pkg/vnode/kubelet.go).
          #
          # Must be THIS Pod's IP, not a Service: tracked pods live in the leader's
          # memory, so a Service could reach a replica that knows nothing about the pod.
          # Unset (manager off-cluster) just disables the endpoint.
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          # Identity used to give the kubelet-serving CSR a stable name for this
          # exact Pod. The private key remains in memory; a recreated Pod gets a
          # new UID and a separate request.
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        envFrom:
          # Provider credentials live in a per-provider Secret, one secretRef per
          # provider — NOT a single shared secret. This matches the "creds-absent →
          # skip that provider, not fatal" model (see registerProviders): each
          # secretRef is independently optional=true, so configuring Modal but not
          # RunPod just skips RunPod. It also isolates rotation and RBAC per
          # provider. Providers namespace their env vars (MODAL_TOKEN_ID,
          # RUNPOD_API_KEY, ...), so the merged environment never collides.
          #
          # The Modal SDK reads MODAL_TOKEN_ID / MODAL_TOKEN_SECRET from the environment,
          # plus an optional MODAL_ENVIRONMENT naming the Modal Environment sandboxes
          # are created in (absent = the token profile's default). See docs/deploy.md.
          - secretRef:
              name: nebula-modal-credentials
              optional: true
          # AWS credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), read by
          # the SDK's default chain. optional=true so an absent Secret is fine —
          # in production this is the norm: prefer IRSA / instance role and skip
          # this Secret entirely. There is no non-secret AWS env: regions come from
          # the NodePool, so this Secret is the ONLY AWS config here.
          - secretRef:
              name: nebula-aws-credentials
              optional: true
          # Add one secretRef per provider as adapters land, e.g.:
          # - secretRef:
          #     name: nebula-runpod-credentials
          #     optional: true
        ports:
        # The kubelet API the API server dials for `kubectl logs` (10250, like a real
        # kubelet). Declaring it is documentation and NetworkPolicy surface; the
        # listener binds either way.
        #
        # It starts with a self-signed cert, then requests a kubelet-serving cert for
        # POD_IP. Managed control planes that verify kubelet certificates use the
        # signed cert after an external approver approves its CSR. Client certs are
        # still not verified by default: restrict this port with a NetworkPolicy, or
        # set --kubelet-client-ca to require mTLS.
        - name: kubelet-api
          containerPort: 10250
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # The manager is not a leaf controller: it runs one virtual kubelet per provider,
        # each with its own pod-sync workers and poll loop, plus the placement and claim
        # controllers, so its cost scales with the FLEET, not with the number of CRDs. The
        # kubebuilder default (500m / 128Mi) is a scaffold value — at a few hundred Pods it
        # is a CFS throttle on the very loops that are supposed to keep up.
        #
        # Requests EQUAL limits, which is Guaranteed QoS: no CFS throttling of the sync
        # loops, and the kubelet evicts this Pod last under node pressure — the manager
        # going down takes provisioning and teardown with it. The cost is that the whole
        # amount must be allocatable on one node for the Pod to schedule at all, so a small
        # dev cluster (Kind on a laptop with a modest Docker VM) may need these lowered.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: catalog
            mountPath: /etc/nebula/catalog
            readOnly: true
      volumes:
        - name: catalog
          configMap:
            # Unprefixed on purpose: config/default's namePrefix rewrites this
            # reference to the generated "nebula-catalog" ConfigMap. optional so
            # the manager still starts (embedded-CSV fallback) if it's absent.
            name: catalog
            optional: true
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
