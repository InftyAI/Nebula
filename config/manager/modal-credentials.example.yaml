# Modal provider credentials — EXAMPLE, not applied by kustomize.
#
# The manager's Deployment consumes this via an optional `envFrom.secretRef`
# (see manager.yaml). Credentials are kept in a per-provider Secret rather than
# the manifest, and one secretRef per provider — configuring Modal but not
# another provider simply skips the unconfigured one (see registerProviders).
#
# To use:
#   1. Get a Modal token pair: `modal token new` (or from the Modal dashboard),
#      which yields a token id (ak-...) and token secret (as-...).
#   2. Create the Secret in the manager's namespace. Prefer `kubectl create
#      secret` over committing this file with real values:
#
#        kubectl create secret generic nebula-modal-credentials \
#          --namespace nebula-system \
#          --from-literal=MODAL_TOKEN_ID=ak-xxxxxxxxxxxxxxxx \
#          --from-literal=MODAL_TOKEN_SECRET=as-xxxxxxxxxxxxxxxx
#
#      Optional keys: MODAL_ENVIRONMENT (Modal workspace environment) and
#      MODAL_APP_NAME (the Modal App all Nebula sandboxes are created under;
#      defaults to "nebula").
#
# The key NAMES matter: the Modal SDK reads MODAL_TOKEN_ID / MODAL_TOKEN_SECRET
# straight from the environment, and envFrom projects every key in this Secret
# as an env var of the same name.
#
# This YAML is provided only for teams that manage Secrets declaratively (sealed
# secrets, SOPS, GitOps). Replace the placeholders below — do NOT commit real
# tokens in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: nebula-modal-credentials
  namespace: nebula-system
type: Opaque
stringData:
  MODAL_TOKEN_ID: "ak-REPLACE_ME"
  MODAL_TOKEN_SECRET: "as-REPLACE_ME"
  # MODAL_ENVIRONMENT: "main"
  # MODAL_APP_NAME: "nebula"
