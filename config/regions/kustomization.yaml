# Renders regions.yaml into the ConfigMap the manager mounts at /etc/nebula/regions.
# Included by config/default, which applies the `nebula-` prefix and `nebula-system`
# namespace and rewrites the Deployment's `regions` reference to match.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
- name: regions
  files:
  - regions.yaml

generatorOptions:
  # A stable name, so the volume reference and `kubectl edit` keep working.
  disableNameSuffixHash: true
