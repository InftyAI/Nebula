# The Secret the webhook serving keypair lives in.
#
# It is created EMPTY on purpose, and that is not a placeholder — it is required.
# The cert rotator (pkg/cert) does a Get followed by an Update on this Secret and
# never a Create, so an absent Secret is a fatal startup error ("acquiring secret to
# update certificates: not found") that crash-loops the manager. An empty Secret is
# exactly what it expects: `secret.Data == nil` is the trigger for minting the CA and
# server certs and writing them back here.
#
# So the contents are owned entirely by the manager at runtime — never commit key
# material, and do not hand-populate it. It is also the shared source of truth across
# replicas: the first pod to run mints the keypair into this Secret, and later pods
# find it already valid and just write it to their own local disk.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
