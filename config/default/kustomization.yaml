# Adds namespace to all resources.
namespace: nebula-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: nebula-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# Price/availability catalog ConfigMap, rendered from the checked-in CSVs and
# mounted by the manager at /etc/nebula/catalog.
- ../catalog
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- ../webhook
# [CERTMANAGER] cert-manager is intentionally NOT used, and neither is any
# out-of-band cert step. The manager provisions its own webhook serving cert
# in-process at startup (pkg/cert): it mints the keypair into a Secret, writes it
# to disk, patches the caBundle into the webhook config, and RENEWS it before
# expiry. To switch to cert-manager, re-add `- ../certmanager` here, re-enable the
# CERTMANAGER replacements blocks below, and drop the CertsManager call from
# cmd/main.go. See docs/deploy.md.
#- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml

# Uncomment the patches line if you enable Metrics
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    # Scope to the manager ONLY (matches the pre-prefix name). The manager is
    # currently the only Deployment in the build, so this is defensive rather than
    # load-bearing: without a name, kustomize applies the patch to EVERY Deployment,
    # so the day an overlay adds a second one it would silently receive the
    # manager-only --metrics-bind-address flag and fail to start on an unknown flag.
    name: controller-manager

# Uncomment the patches line if you enable Metrics and CertManager
# [METRICS-WITH-CERTS] To enable metrics protected with certManager, uncomment the following line.
# This patch will protect the metrics with certManager self-signed certs.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
    # Scope to the manager ONLY (see the metrics patch above) — otherwise a second
    # Deployment added later would also get the webhook port, volume and cert mount.
    name: controller-manager

