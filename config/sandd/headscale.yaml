# headscale — the Tailscale control server that coordinates the SandD mesh.
#
# ⚠️  DEVELOPMENT / EXAMPLE configuration. It uses SQLite on an emptyDir (state is
#     LOST on Pod restart, which invalidates every issued auth key) and a plain
#     HTTP listener. For production see https://headscale.net and back it with a
#     PersistentVolume + a real database + TLS.
#
# It MUST be reachable by out-of-cluster GPU boxes (they join the same mesh), so
# it is exposed with a Service type=LoadBalancer. The controller joins over the
# same address, so one URL serves both sides.
#
# Namespace + the nebula- name prefix are added by config/default's kustomize, so
# they are omitted here (the ConfigMap/Service refs below stay unprefixed too).
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
data:
  config.yaml: |
    # server_url MUST equal the address clients actually dial (the LoadBalancer
    # DNS name/IP). headscale rejects a client whose --login-server disagrees with
    # this. If your LB address is not known ahead of time, edit this to the
    # resolved address and restart the Deployment. Port 8080 matches the Service.
    server_url: http://REPLACE_WITH_LOADBALANCER_ADDRESS:8080
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    # Mesh IP range (RFC 6598 CGNAT, as Tailscale/headscale recommend). The first
    # client (the controller) gets 100.64.0.1, which is why SANDD_SERVER_URL is
    # ws://100.64.0.1:8765/ws.
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48

    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    database:
      type: sqlite3
      sqlite:
        path: /var/lib/headscale/db.sqlite

    log:
      level: info
      format: text

    dns:
      magic_dns: true
      base_domain: nebula.mesh
      nameservers:
        global:
          - 1.1.1.1

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  labels:
    app: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:0.23
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50443
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            # Unprefixed: config/default's namePrefix rewrites this reference to
            # the generated nebula-headscale-config ConfigMap.
            name: headscale-config
        # emptyDir => state is EPHEMERAL (example only). Replace with a
        # PersistentVolumeClaim for anything you care about keeping.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  labels:
    app: headscale
spec:
  # LoadBalancer so out-of-cluster GPU boxes can reach the control server. Swap
  # for NodePort + DNS, or front with an Ingress, if you have no LB provider.
  type: LoadBalancer
  selector:
    app: headscale
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50443
      targetPort: 50443
