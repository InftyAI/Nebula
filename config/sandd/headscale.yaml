# headscale — the Tailscale control server that coordinates the SandD mesh.
#
# ⚠️  DEVELOPMENT / EXAMPLE configuration. It uses SQLite on an emptyDir (state is
#     LOST on Pod restart, which invalidates every issued auth key) and a plain
#     HTTP listener. For production see https://headscale.net and back it with a
#     PersistentVolume + a real database + TLS.
#
# It MUST be reachable by out-of-cluster GPU boxes (they join the same mesh). The
# LoadBalancer Service that exposes it is hand-applied FIRST — it lives OUTSIDE this
# overlay (config/samples/headscale-service.yaml) precisely because everything in
# config/sandd/ is applied together by `make deploy`, whereas the Service must go up
# on its own so its ELB hostname is known before this Deployment starts. See that
# file and the README for why. This file (the ConfigMap + Deployment) is what the
# ../sandd kustomize overlay deploys.
#
# Namespace + the nebula- name prefix are added by config/default's kustomize, so
# they are omitted here (the ConfigMap ref below stays unprefixed too).
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
data:
  config.yaml: |
    # server_url MUST equal the address clients actually dial (the LoadBalancer
    # DNS name/IP). headscale rejects a client whose --login-server disagrees with
    # this. Apply config/samples/headscale-service.yaml FIRST, read its ELB
    # hostname, and set it here BEFORE `make deploy` — headscale starts correct, no
    # restart.
    # Port 8080 matches the Service.
    server_url: http://k8s-nebulasy-nebulahe-d7d09ad3c3-19bbf71952ff4e76.elb.eu-north-1.amazonaws.com:8080
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    # Mesh IP range (RFC 6598 CGNAT, as Tailscale/headscale recommend). Nodes are
    # addressed by MagicDNS name (base_domain below), not raw IP, so which node
    # gets which 100.64.x.x address does not matter.
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48

    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    database:
      type: sqlite3
      sqlite:
        path: /var/lib/headscale/db.sqlite

    log:
      level: info
      format: text

    dns:
      magic_dns: true
      base_domain: nebula.mesh
      nameservers:
        global:
          - 1.1.1.1

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  labels:
    app: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:0.23
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            # grpc (:50443) is intentionally NOT published on the LoadBalancer
            # (see config/samples/headscale-service.yaml): the admin API mints
            # users/keys, so it stays reachable only in-pod via `kubectl exec`. The
            # process still listens on it (grpc_listen_addr) for that local CLI use.
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            # Unprefixed: config/default's namePrefix rewrites this reference to
            # the generated nebula-headscale-config ConfigMap.
            name: headscale-config
        # emptyDir => state is EPHEMERAL: on a reschedule (node scale-down, spot
        # reclaim, rollout) the SQLite DB is WIPED, which invalidates every issued
        # auth key and drops the whole mesh. Fine for kind/dev; on EKS replace with
        # a PersistentVolumeClaim (EBS gp3, RWO — fine at replicas: 1). See README.
        - name: data
          emptyDir: {}
