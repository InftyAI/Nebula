# headscale — the Tailscale control server that coordinates the SandD mesh.
#
# ⚠️  DEVELOPMENT / EXAMPLE configuration. It uses SQLite on a small PVC (state
#     survives Pod restarts, but it is still a single-writer file DB) and a plain
#     HTTP listener. For production see https://headscale.net and back it with a
#     real database + TLS.
#
# It MUST be reachable by out-of-cluster GPU boxes (they join the same mesh). The
# LoadBalancer Service that exposes it is hand-applied FIRST — it lives OUTSIDE this
# overlay (config/samples/headscale-service.yaml) precisely because everything in
# config/sandd/ is applied together by `make deploy`, whereas the Service must go up
# on its own so its ELB hostname is known before this Deployment starts. See that
# file and the README for why. This file (the ConfigMap + Deployment) is what the
# ../sandd kustomize overlay deploys.
#
# Namespace + the nebula- name prefix are added by config/default's kustomize, so
# they are omitted here (the ConfigMap ref below stays unprefixed too).
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
data:
  config.yaml: |
    # server_url MUST equal the address clients actually dial. headscale rejects a
    # client whose --login-server disagrees with this. It is the internet-facing NLB's
    # AWS-assigned hostname (config/samples/headscale-service.yaml), only known AFTER
    # the Service provisions. The literal token below is substituted by `make deploy`
    # from SANDD_TUNNEL_SERVER (set in .env; deploy-all reads the hostname back — README
    # step 1). This value is byte-identical to SANDD_TUNNEL_SERVER in nebula-sandd-config
    # (same token, same substitution), which is exactly what headscale requires. The
    # value is a bare http://<host> with NO port: the Service listens on 80 (Tailscale's
    # Noise handshake only dials 80/443, never a custom port), and headscale itself still
    # listens on 8080 in-pod (listen_addr below); the Service maps 80 -> 8080.
    server_url: __SANDD_TUNNEL_SERVER__
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    # The keybroker sidecar (below) mints pre-auth keys via the headscale CLI over
    # THIS local unix socket — no admin API key, no gRPC exposure. Both containers
    # mount the same emptyDir at /var/run/headscale, so the CLI in the sidecar
    # reaches headscale in-pod. Nothing outside the pod can touch it.
    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"

    # Mesh IP range (RFC 6598 CGNAT, as Tailscale/headscale recommend). Nodes are
    # addressed by MagicDNS name (base_domain below), not raw IP, so which node
    # gets which 100.64.x.x address does not matter.
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48

    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    database:
      type: sqlite3
      sqlite:
        path: /var/lib/headscale/db.sqlite

    log:
      level: info
      format: text

    dns:
      magic_dns: true
      base_domain: nebula.mesh
      nameservers:
        global:
          - 1.1.1.1

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  labels:
    app: headscale
spec:
  replicas: 1
  # Recreate (not the default RollingUpdate): headscale's state is on a single
  # ReadWriteOnce PVC (data volume below). RollingUpdate starts the new pod before
  # killing the old one, so both would race for the same RWO volume -> the new pod
  # hangs on a Multi-Attach error. Recreate tears the old pod down first. Fine at
  # replicas: 1 (headscale is single-writer over SQLite anyway).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:0.23
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            # grpc (:50443) is intentionally NOT published on the LoadBalancer
            # (see config/samples/headscale-service.yaml): the admin API mints
            # users/keys, so it stays reachable only in-pod via `kubectl exec`. The
            # process still listens on it (grpc_listen_addr) for that local CLI use.
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            # Shared with the keybroker sidecar so its `headscale` CLI can dial this
            # process's local admin socket (unix_socket above).
            - name: socket
              mountPath: /var/run/headscale
          # Sized for the whole mesh: headscale holds every node's state in-process
          # and recomputes/pushes the netmap to all peers on each change, so both CPU
          # and memory scale with node count, not with request rate. requests == limits
          # keeps the pod Guaranteed — a throttled or OOM-killed control server drops
          # the mesh for every joined node at once.
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        # keybroker — mints pre-auth keys on demand so nothing else needs headscale
        # admin authority. Runs as a SIDECAR here (not a separate Deployment) so it
        # can reach headscale over the shared LOCAL unix socket: no admin API key to
        # store, no gRPC port exposed. It serves an in-cluster-only HTTP API
        # (nebula-keybroker Service) that the manager (per-daemon keys) and the
        # controller (its own key) call. Image built from Dockerfile.keybroker
        # (FROM headscale, so the CLI is present); keep its headscale tag in sync
        # with the headscale container above.
        - name: keybroker
          image: inftyai/nebula-keybroker:latest
          env:
            # The CLI reads unix_socket from headscale's config, so point the broker
            # at the SAME config file the headscale container uses.
            - name: SANDD_KEYBROKER_HS_CONFIG
              value: /etc/headscale/config.yaml
            # Keys are minted under this headscale user. The broker ensures it exists
            # at startup (creates it if missing), so no manual bootstrap is needed.
            - name: SANDD_KEYBROKER_USER
              value: nebula
          ports:
            - name: broker
              containerPort: 8090
          volumeMounts:
            # Read the same config (for unix_socket) ...
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            # ... and share the socket dir so the CLI reaches headscale in-pod.
            - name: socket
              mountPath: /var/run/headscale
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            # Unprefixed: config/default's namePrefix rewrites this reference to
            # the generated nebula-headscale-config ConfigMap.
            name: headscale-config
        # headscale's SQLite DB + keys live here. Backed by a PVC (not emptyDir) so
        # the DB SURVIVES pod recreation: with emptyDir, any reschedule (node
        # scale-down, spot reclaim, rollout) wiped every registration, which
        # orphaned already-joined nodes — in particular the PVC-backed controller,
        # which then loops re-registering an identity headscale no longer knows. A
        # PVC keeps that state, so a headscale restart no longer drops the mesh.
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        # Ephemeral socket dir shared by headscale + keybroker so the sidecar's CLI
        # reaches headscale's local admin socket. Never leaves the pod.
        - name: socket
          emptyDir: {}
---
# Persists headscale's SQLite DB + private keys across pod recreation. Without it
# (emptyDir) a rescheduled headscale came up with an EMPTY database, invalidating
# every issued auth key and orphaning already-joined nodes — most visibly the
# controller, whose OWN identity is on a PVC, so it survived while headscale forgot
# it and looped re-registering. RWO is fine at replicas: 1 (headscale is a single
# SQLite writer); pair with strategy: Recreate on the Deployment so a rollout does
# not race two pods for this volume. gp3 to match the cluster default (same SC as
# the controller PVC); swap the storageClassName for your environment. This is still
# a DEV setup — for production also move off SQLite to a real DB + TLS (see README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-data
  labels:
    app: headscale
spec:
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # SQLite DB + a couple of key files — tiny; 1Gi is the common minimum
      # granularity for dynamically-provisioned block volumes.
      storage: 1Gi
---
# In-cluster API for the keybroker sidecar. ClusterIP ONLY — this mints mesh
# credentials, so it must never be exposed outside the cluster (unlike the
# headscale Service, which is a public LoadBalancer for out-of-cluster GPU boxes).
# The manager dials it to mint a per-daemon key at provision time; the SandD
# controller dials it at startup to mint its own key.
apiVersion: v1
kind: Service
metadata:
  name: keybroker
  labels:
    app: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
    - name: broker
      port: 8090
      targetPort: broker
