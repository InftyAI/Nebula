# nebula-sandd-config — flips SandD injection ON for the manager. Deployed by this
# overlay (namePrefix in config/default turns "sandd-config" into "nebula-sandd-config";
# the manager's envFrom references the pre-prefix name so kustomize rewrites both).
#
# A ConfigMap, not a Secret: it holds only URLs. The mesh keys are minted on demand
# by the key broker and never stored here.
#
# SANDD_TUNNEL_SERVER is headscale's server_url — the address the out-of-cluster GPU
# daemons dial to join the mesh. It is the internet-facing NLB's AWS-assigned hostname
# (see config/samples/headscale-service.yaml), resolving to PUBLIC IPs: the mesh spans
# clouds and AWS regions that share no private network with the cluster, so the control
# plane must be publicly routable (a ClusterIP or internal-LB name would be unreachable
# from a box in another region/cloud). Paste the hostname read back after the Service
# provisions (README step 1); keep it identical to server_url in headscale.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandd-config
  namespace: nebula-system
data:
  # In-cluster key broker (the switch that turns injection ON): the manager mints a
  # fresh single-use, ephemeral key per workload from here. Stable internal Service
  # DNS — no per-cluster edit needed.
  SANDD_KEYBROKER_URL: "http://nebula-keybroker.nebula-system:8090"
  # headscale control-server URL — the internet-facing NLB's AWS-assigned hostname.
  # The literal token below is substituted by `make deploy` from SANDD_TUNNEL_SERVER
  # (set it in .env; deploy-all reads it back). It stays a token in the tracked file
  # because the hostname is per-cluster and changes on every Service recreate. Kept
  # byte-identical to server_url in headscale.yaml (same token, same substitution).
  SANDD_TUNNEL_SERVER: "__SANDD_TUNNEL_SERVER__"
  # The controller's SandD WebSocket URL, reached OVER the mesh by MagicDNS name.
  # Stable convention (headscale base_domain nebula.mesh + controller hostname), so
  # no per-cluster edit needed.
  # TODO: dynamically set this.
  SANDD_SERVER_URL: "ws://sandd-controller.nebula.mesh:8765/ws"
