# [SANDD] SandD access channel — OPT-IN, disabled by default.
#
# SandD lets an operator/agent run commands and open interactive shells INSIDE a
# Nebula-provisioned workload container (kubectl logs/exec do NOT work against a
# Nebula virtual node — see pkg/vnode/handler.go). The daemon runs inside the
# workload, dials OUT to a controller over a Tailscale/headscale mesh, so it needs
# no inbound access to the GPU box. See pkg/provider.SanddConfig and the AWS
# entrypoint shim in pkg/provider/aws/translate.go.
#
# This overlay deploys only the shared INFRASTRUCTURE that backs the channel:
#   - headscale.yaml : the Tailscale control server (assigns mesh IPs)
#
# headscale's LoadBalancer Service is deliberately NOT here: it must be applied on
# its own, FIRST, so its ELB hostname is known before headscale starts (that
# address is headscale's server_url). Everything in this folder is applied together
# by `make deploy`, so the Service lives in config/samples/headscale-service.yaml
# and is hand-applied — see README.md step 1.
#
# The CONTROLLER (a SandD Server() you drive with your own exec/session logic) is
# deliberately NOT here — it is the user-facing piece, so it ships as a hand-applied
# sample (config/samples/sandd-controller.yaml) you adapt, not a fixed resource.
#
# This overlay flips the manager ON: it ships nebula-sandd-config (manager-config.yaml),
# which the manager's optional envFrom reads to enable injection. So deploying this
# overlay + a controller is all it takes — but SANDD_TUNNEL_SERVER in that ConfigMap
# is a per-cluster placeholder (the headscale LB hostname), so injection only works
# once you fill it in (see README.md). Comment the resource out to keep SandD off.
resources:
  - headscale.yaml
  - manager-config.yaml
