  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nebula.inftyai.com
  resources:
  - nodeclaims
  - nodepools
  - sandboxes
  - sandboxsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nebula.inftyai.com
  resources:
  - nodeclaims/finalizers
  - nodepools/finalizers
  - sandboxes/finalizers
  - sandboxsets/finalizers
  verbs:
  - update
- apiGroups:
  - nebula.inftyai.com
  resources:
  - nodeclaims/status
  - nodepools/status
  - sandboxes/status
  - sandboxsets/scale
  - sandboxsets/status
  verbs:
  - get
  - patch
  - update
