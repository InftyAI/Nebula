# What Nebula may do in a target cluster, the host cluster included. Apply it in every target
# cluster, and map the identity Nebula authenticates to that cluster with into the "nebula"
# group, the way the cluster's provider maps identities to Kubernetes groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nebula-remote
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # Namespace isolation's fence (pkg/provider/kubernetes/netpol.go), on once the table has cidrs:
  # a target's ingress NetworkPolicy, and the host's Admin-tier ClusterNetworkPolicy.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["networking.k8s.aws"]
    resources: ["clusternetworkpolicies"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nebula-remote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nebula-remote
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: nebula
