# Maintains N Sandboxes. Provisioning an instance takes MINUTES while an agent's
# exec call wants sub-second, so boxes are kept ready ahead of demand:
#
#   kubectl get sandboxes -l nebula.inftyai.com/sandboxset=sample
#   kubectl scale sandboxset/sample --replicas=5
#
# Boxes get generated names (sample-a4f2x), not ordinals, because an ordinal would
# imply a slot that gets refilled — a replacement box wearing a dead box's name is
# the same address with a different filesystem. A generated name makes a
# replacement visibly a new box.
#
# A template change does NOT roll existing boxes (this is ReplicaSet-shaped, not
# Deployment-shaped): rolling would evict live sessions and burn minutes of
# provisioning per box. New boxes get the new template; existing ones are left alone.
apiVersion: nebula.inftyai.com/v1alpha1
kind: SandboxSet
metadata:
  labels:
    app.kubernetes.io/managed-by: nebula
  name: sample
spec:
  replicas: 30
  template:
    metadata:
      labels:
        team: ml
    spec:
      nodePoolRef: sample
      image: ubuntu:24.04
      # T4 x1 (g4dn.xlarge) — the (type, count) pair must exist in the provider
      # catalog, since on EC2 the GPU count is part of the instance type rather than a
      # free knob. See the Sandbox sample for the full explanation. Note this is
      # multiplied by `replicas` above: three boxes means three billable instances.
      acceleratorType: l4
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
        limits:
          nvidia.com/gpu: "8"
