# A minimal GPU workload that opts into Nebula placement.
#
# A workload opts in with just THREE fields on the POD TEMPLATE — everything else
# Nebula adds for you (the webhook and placement controller act on Pods, so the
# opt-in lives on spec.template, NOT on the Deployment's own metadata):
#   1. label  nebula.inftyai.com/enabled: "true"   -> opt in (webhook acts only on this)
#   2. label  nebula.inftyai.com/nodepool: <name>  -> which NodePool to place against
#   3. label  nebula.inftyai.com/accelerator-type: <type>  -> requested GPU type
#      (count rides on the standard nvidia.com/gpu resource below)
#
# On CREATE, the mutating webhook injects the provider-selection scheduling gate
# and a toleration for the virtual-node taint on each Pod. The Pod sits
# SchedulingGated until the placement controller picks a provider from the pool,
# stamps the provider nodeSelector, and removes the gate — then the Pod binds to
# that provider's virtual node and the VK provisions the real instance.
#
# A Deployment (rather than a bare Pod) means its ReplicaSet recreates a Pod that
# fails or is torn down, so the workload — and its backing GPU instance — is
# self-healing rather than a one-shot that lingers Failed.
#
# Prereqs: the NodePool must exist (kubectl apply -f config/samples/nodepool.yaml
# -f config/samples/deployment.yaml applies both), and its providers must be
# registered (their credential Secrets present).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-workload-sample
  namespace: default
  labels:
    app.kubernetes.io/managed-by: nebula
spec:
  replicas: 30
  selector:
    matchLabels:
      app: gpu-workload-sample
  template:
    metadata:
      labels:
        app: gpu-workload-sample
        nebula.inftyai.com/enabled: "true"
        nebula.inftyai.com/nodepool: sample
        nebula.inftyai.com/accelerator-type: t4
    spec:
      # Do NOT set nodeName or a provider nodeSelector yourself — the placement
      # controller fills the nodeSelector in when it ungates the Pod. Setting
      # nodeName would bypass placement entirely (the webhook skips bound Pods).
      containers:
      - name: workload
        # A CUDA base image so nvidia-smi and the GPU userspace are present — a
        # plain image (e.g. busybox) has no nvidia-smi. Any CUDA/GPU image works;
        # this one is small and only needs the driver from the host.
        image: nvidia/cuda:12.4.1-base-ubuntu22.04
        # Print the GPUs the sandbox sees, then run the daemon-server webserver in
        # the foreground so the sandbox has a real, reachable service on it.
        #
        # Split command/args purely for readability: the provider concatenates them
        # (Command + Args) into the one argv Modal takes, so this is exactly
        # ["sh", "-c", "<script>"].
        #
        # `kubectl logs` works here, -f and --tail included (pkg/vnode/kubelet.go).
        # `--timestamps`, `--previous` and `--since` are accepted but ignored: a
        # provider stream has no per-line time and no restart history.
        #
        # `kubectl exec` does not — no in-container agent serves it. Use the Modal
        # dashboard or `modal shell` for a shell.
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          nvidia-smi --query-gpu=index,name,memory.total --format=csv || echo 'no nvidia-smi'

          # curl is absent from the CUDA base image, so install it before fetching.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates

          # linux-amd64 because every currently-wired provider is x86 (the virtual
          # node advertises kubernetes.io/arch=amd64 — see pkg/vnode/node.go).
          cd /tmp
          base=https://github.com/hiverge/daemon-server/releases/download/v0.0.1-dev20
          curl -fsSLO "$base/daemon-server-linux-amd64"
          curl -fsSLO "$base/daemon-server-linux-amd64.sha256"
          # Verify before executing — this is a binary pulled off the internet into a
          # box holding your credentials. Keep the asset FILENAME as downloaded: the
          # published .sha256 names it, so renaming to ./daemon-server (as the release
          # notes' snippet does) makes `sha256sum -c` fail on a missing file.
          sha256sum -c daemon-server-linux-amd64.sha256
          chmod +x daemon-server-linux-amd64

          # REPO_DIR/BACKUP_DIR default to these; create them so the server does not
          # have to. exec so the webserver becomes the container's main process and
          # receives the provider's stop signal directly.
          mkdir -p /app /.backup
          exec env PORT=8080 ./daemon-server-linux-amd64
        # Declaring the port is what makes the webserver REACHABLE. Modal routes one
        # port per connect token and the first declared port wins (see firstPort in
        # pkg/provider/modal), so this is the port the URL published on the Pod's
        # nebula.inftyai.com/endpoint annotation lands on. With no port declared the
        # URL would route to Modal's own default and never reach daemon-server.
        ports:
        - containerPort: 8080
        # The readiness bar for the EXTERNAL instance, and on Modal the only way to tell
        # "still coming up" from "up and serving": the poll signal answers only "has the
        # process exited?", so without a probe the Pod (and the Deployment's ready
        # count) goes Running as soon as the sandbox is created.
        #
        # /health is daemon-server's own endpoint, so it passes only once the GPU
        # attached, curl installed, and the binary started. An exec probe on
        # `nvidia-smi -L` would go ready during apt-get, publishing an endpoint that
        # still refuses connections.
        #
        # On Modal this DEGRADES to a tcpSocket probe on the same port — it offers exec
        # and TCP only, so the real bar is "is 8080 listening?" (see planProbe). Written
        # as httpGet anyway, because that is right on a provider that serves it.
        #
        # The port must be NUMERIC: a named port cannot become a Modal probe, so the
        # probe — and the readiness signal — is dropped. periodSeconds becomes the probe
        # interval; the other timing fields are the kubelet's, which never runs here.
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            # GPU count. Standard extended resource, so the scheduler's fit check
            # and provisioning read the same number. 8 => 8x the accelerator-type
            # above.
            nvidia.com/gpu: "1"
