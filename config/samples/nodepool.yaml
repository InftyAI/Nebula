apiVersion: nebula.inftyai.com/v1alpha1
kind: NodePool
metadata:
  labels:
    app.kubernetes.io/managed-by: nebula
  name: sample
spec:
  # strategy (the inner, provider-ranking axis).
  providers:
  # - name: aws
  #   regions:
  #   - us
  #   - eu
  #   - ap
  #   - ca-central-1
  #   - sa-east-1
  # - name: modal
  #   regions:
  #   - us
  #   - eu
  #   - ap-melbourne
  - name: runpod
    # A region is a geography (us, eu, ...) or one exact data center (EU-RO-1). Each
    # entry is one failover candidate, so a shortage in one blocklists only that one.
    regions:
    - us
    - eu
  # Outer axis: try OnDemand on every provider first, fall back to Spot.
  capacityTypes:
  - OnDemand
  - Spot
  # Inner axis: within the active capacity tier.
  strategy: Ordered
  failover:
    blocklistTTL: 30s
  # Outbound network policy. Omitted (as here) means Open. Inbound is never restricted, so a
  # sandbox stays reachable through its connect URL and token under every mode — it just
  # cannot call out.
  #
  # Setting ANY mode other than Open narrows this pool to the providers that can enforce
  # it: placement skips a provider whose Capabilities report SupportsEgressPolicy=false
  # (RunPod, which exposes no outbound knob at all), rather than provisioning something
  # with open internet access under a policy that says otherwise.
  #
  # Blocked permits nothing:
  # egress:
  #   mode: Blocked
  #
  # Allowlist permits only what it lists — CIDRs, bare IPs and domain names (wildcards
  # allowed) in ONE list; the adapter sorts them by kind. Use this when the workload pulls
  # model weights at startup, which hangs under Blocked:
  # egress:
  #   mode: Allowlist
  #   targets:
  #   - "*.huggingface.co"
  #   - 10.0.0.0/8
