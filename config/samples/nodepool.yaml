apiVersion: nebula.inftyai.com/v1alpha1
kind: NodePool
metadata:
  labels:
    app.kubernetes.io/managed-by: nebula
  name: sample
spec:
  # strategy (the inner, provider-ranking axis).
  providers:
  - name: modal
  # - name: aws
  #   regions:
  #   - us-east-1
  #   - us-west-1
  #   - ap-south-1
  #   - ap-northeast-1
  #   - eu-central-1
  #   - eu-west-1
  #   - ca-central-1
  #   - sa-east-1
  # - name: runpod
  # Outer axis: try OnDemand on every provider first, fall back to Spot.
  capacityTypes:
  - OnDemand
  - Spot
  # Inner axis: within the active capacity tier.
  strategy: Ordered
  failover:
    blocklistTTL: 30s
