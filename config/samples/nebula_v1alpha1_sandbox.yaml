# One remote box, provisioned on a NeoCloud GPU provider and surfaced as a Pod.
#
# NOTE: `kubectl exec` and `kubectl logs` do NOT work against a sandbox yet. The Pod
# is backed by an instance in another cloud rather than a kubelet, and the in-container
# agent that would serve those routes is not part of the project today — the virtual
# kubelet answers NotFound. Watch `kubectl get sandbox` for phase/endpoint instead.
#
# There is no command field, by design: a box has nothing to run at boot, so the
# controller supplies a placeholder command whose only job is to keep the container
# alive. A user-supplied one would displace it and take the instance down with it.
apiVersion: nebula.inftyai.com/v1alpha1
kind: Sandbox
metadata:
  labels:
    app.kubernetes.io/managed-by: nebula
  name: sample
spec:
  # The placement policy this box is provisioned against: which providers are
  # allowed, which capacity tiers, how to rank them.
  nodePoolRef: sample
  # Optional — defaults to ubuntu:24.04, which is all a "give me a remote shell" box
  # needs. Note it does NOT become a CUDA image when you ask for an accelerator; name
  # one explicitly if you want the toolkit preinstalled.
  image: ubuntu:24.04
  # The accelerator TYPE is a label-shaped field; the COUNT rides on the
  # nvidia.com/gpu resource below, so exactly one number drives both scheduling
  # fit and provisioning. Omit both for a CPU-only box.
  #
  # The (type, count) pair must EXIST in the provider's catalog, because on EC2 the
  # GPU count is baked into the instance type rather than being a free knob — the
  # pair is a lookup key, not two independent numbers. T4 x1 resolves to
  # g4dn.xlarge; a100-40gb x1 resolves to NOTHING (AWS's smallest A100-40GB box is
  # p4d.24xlarge, which has 8), and provisioning fails before any instance starts.
  # Run `kubectl get nodepool` / see pkg/provider/catalog/data/aws.csv for the
  # pairs on offer. T4 x1 is the sample's default because it is the cheapest shape
  # that actually launches.
  acceleratorType: t4
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      nvidia.com/gpu: "1"
