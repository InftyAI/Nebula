# SandD controller — a `Server()` in tunnel mode. This is the box YOU drive:
# `server.exec(daemon_id, ...)` / `server.new_session(...)` run commands and open
# PTYs on the GPU workloads. It joins the same headscale mesh, takes the first IP
# (100.64.0.1), and listens for daemons on :8765 OVER the mesh — no port is
# exposed to the cluster or the internet.
#
# SAMPLE, not part of the kustomize overlay: the controller is the USER-FACING
# piece — you replace the inline script below with your own controller logic — so
# it is applied by hand and adapted, not deployed as a fixed resource. It sets its
# own namespace and full name (nothing rewrites them here). Apply after the
# config/sandd overlay is up — see config/sandd/README.md.
#
# The image is SandD's tunnel-server build (Python `sandd` package + Tailscale
# client preinstalled). Build/push it from the SandD repo:
#   docker build -f hack/docker/Dockerfile.server-tunnel -t inftyai/sandd-server-tunnel:latest.
#
# The controller mints its own mesh key at startup from the in-cluster key broker
# (SANDD_KEYBROKER_URL below), as REUSABLE + EPHEMERAL: reusable so restarts can
# re-register, ephemeral so headscale reaps the node once you delete the experiment
# (no orphan offline nodes piling up). The PVC below keeps the node key stable WHILE
# the experiment runs, so the ephemeral node isn't reaped mid-run under it. The
# headscale URL it joins (SANDD_TUNNEL_SERVER) is set inline in env below — see
# README.md, step 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandd-controller
  namespace: nebula-system
  labels:
    app: sandd-controller
spec:
  replicas: 1
  # Recreate (not the default RollingUpdate): the controller's identity lives on a
  # single ReadWriteOnce PVC (tailscale-state below). RollingUpdate starts the new
  # pod before killing the old one, so both would race for the same RWO volume ->
  # the new pod hangs on a "Multi-Attach" error. Recreate tears the old pod down
  # first, so the new one reclaims the same tailscale node key and keeps its
  # MagicDNS name (sandd-controller.nebula.mesh) across restarts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sandd-controller
  template:
    metadata:
      labels:
        app: sandd-controller
    spec:
      # Pin the pod's OS hostname so it is DETERMINISTIC. Tailscale derives a
      # node's name (and thus its MagicDNS name) from the OS hostname, so this is
      # what makes the controller reliably reachable at
      # sandd-controller.<base_domain> on the mesh — independent of join order or
      # which 100.64.x.x IP it happens to get. headscale's base_domain is
      # nebula.mesh (see config/sandd/headscale.yaml), so the daemons dial
      # ws://sandd-controller.nebula.mesh:8765/ws (SANDD_SERVER_URL below).
      hostname: sandd-controller
      containers:
        - name: controller
          image: inftyai/sandd-server-tunnel:latest
          # Start the Server in tunnel mode and keep it alive. It joins the mesh, then
          # loops listing daemons and runs a few example commands (COMMANDS below) on
          # each workload the first time it connects, printing the output to the pod log
          # (`kubectl logs`) — just enough to show exec over the mesh works. Attach with
          # `kubectl exec` to drive `server` yourself (see README, "Using it"), or edit
          # COMMANDS / replace this with your own controller logic — that's the point.
          command: ["python3", "-u", "-c"]
          args:
            - |
              import os, time, json, urllib.request
              from sandd import Server, TunnelConfig

              # Mint a reusable+ephemeral key for this controller from the in-cluster
              # broker (crash-loops if unreachable — the broker is required, not optional).
              # NEVER print the key itself, only that we got one.
              broker = os.environ["SANDD_KEYBROKER_URL"].rstrip("/")
              req = urllib.request.Request(f"{broker}/keys?kind=controller", method="POST")
              with urllib.request.urlopen(req, timeout=10) as resp:
                  authkey = json.load(resp)["key"]
              print("controller: minted key, joining mesh", flush=True)

              server = Server(connect="tunnel", tunnel_config=TunnelConfig(
                  authkey=authkey, server=os.environ["SANDD_TUNNEL_SERVER"]))
              print("controller: ready, waiting for daemons", flush=True)

              # Commands run on each workload the first time it connects. Edit freely —
              # each runs in the user's container over the mesh via server.exec.
              COMMANDS = ["hostname", "nvidia-smi -L", "ls /"]

              # Run the commands on each daemon once. `seen` guards against re-running
              # every poll.
              seen = set()
              while True:
                  try:
                      for d in server.list_daemons():
                          if d.id in seen:
                              continue
                          seen.add(d.id)
                          for cmd in COMMANDS:
                              r = server.exec(d.id, cmd)
                              print(f"[{d.id}] $ {cmd} (exit={r.exit_code})\n{r.stdout.rstrip()}", flush=True)
                  except Exception as e:
                      print("controller: loop error:", e, flush=True)
                  time.sleep(5)
          env:
            # The headscale URL the controller joins. UNLIKE the daemons (which are
            # out-of-cluster and MUST use the public NLB hostname) and headscale's own
            # server_url, the controller runs IN-cluster, so it reaches headscale by its
            # internal ClusterIP Service name — no per-cluster substitution, and it never
            # touches the public NLB. That matters: routing an in-cluster client through
            # the internet-facing NLB is a needless round-trip AND hairpins (blackholes)
            # when the controller lands on the same node as the headscale pod, which is
            # exactly what made /machine/register time out and fall back to a dead :443.
            # The ClusterIP path is direct and can't hairpin. Port 80 (Service 80 -> 8080)
            # satisfies Tailscale's Noise dialer (80/443 only). headscale accepts this
            # even though its server_url is the public name: authkey registration doesn't
            # require the client's login-server to byte-match server_url. Cross-namespace
            # is fine — the .nebula-system suffix resolves from any namespace. The
            # controller mints its OWN key from the broker, so no auth key here.
            - name: SANDD_TUNNEL_SERVER
              value: http://nebula-headscale.nebula-system
            # In-cluster key broker: the controller mints its OWN reusable+ephemeral
            # key at startup from this endpoint (see resolve_authkey above). This is
            # the nebula-keybroker ClusterIP Service (config/sandd/headscale.yaml).
            # Required — the controller crash-loops if the broker is unreachable.
            - name: SANDD_KEYBROKER_URL
              value: http://nebula-keybroker.nebula-system:8090
          ports:
            # Informational only — the daemons reach this over the mesh, not via a
            # Service. Not exposed cluster-wide.
            - name: sandd-ws
              containerPort: 8765
          # NO added capabilities. tailscaled runs in --tun=userspace-networking
          # mode (userspace TCP/IP stack, no kernel TUN/route), so NET_ADMIN is not
          # needed: inbound mesh TCP is forwarded to the local :8765 listener
          # without touching the host's routing or firewall. NET_ADMIN would let the
          # container rewrite routes/firewall rules and sniff/inject traffic, so we
          # keep it off even on this trusted control-plane side.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: sandd-controller-tailscale
---
# Persists tailscaled's node key across controller restarts. With emptyDir the
# controller re-registered as a BRAND-NEW headscale node every restart; the old
# (now offline) node still held the clean MagicDNS name, so the new one got a
# random -suffix and daemons dialing sandd-controller.nebula.mesh hit a dead node
# ("Active daemons: 0"). A persistent /var/lib/tailscale means the same node key
# is presented on restart -> headscale recognizes the same node and keeps the
# name. Pair with the reusable+ephemeral controller auth key: ephemeral reaps the
# node after you delete the experiment (no orphan pile-up); the PVC keeps identity
# stable WHILE the experiment runs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandd-controller-tailscale
  namespace: nebula-system
  labels:
    app: sandd-controller
spec:
  # Reuse the cluster's existing EBS SC. gp3 is the default here, so this could be
  # omitted, but pinning it keeps the sample from silently following whatever the
  # default becomes later. Swap to gp3-retain if you want the EBS volume (and thus
  # the controller's identity) to survive `delete pvc`; gp3 is Delete, which is the
  # right call for disposable experiment controllers.
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # tailscale state is tiny (node key + a little metadata); 1Gi is the common
      # minimum granularity for dynamically-provisioned block volumes.
      storage: 1Gi
