---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodepools.nebula.inftyai.com
spec:
  group: nebula.inftyai.com
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
    - np
    singular: nodepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.strategy
      name: Strategy
      type: string
    - jsonPath: .spec.providers[*].name
      name: Providers
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodePool is the placement policy for GPU workloads across NeoClouds.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "NodePoolSpec is the placement policy for a set of workloads.
              Editing it changes\nbehaviour for every Pod that selects the pool, without
              touching any workload.\n\nPlacement walks two axes in a fixed order:
              capacity type first, provider second.\n\n\tFOR each capacityType in
              CapacityTypes (in listed order):   // outer: hard tier\n\t    candidates
              = Providers x (each provider's Regions) x {this capacityType},\n\t                 available
              now, minus blocklist                // region nests per provider\n\t
              \   IF candidates non-empty:\n\t        pick one via Strategy (Ordered
              today; see Strategy)      // inner: rank candidates\n\t        DONE\n\t
              \   // else fall through to the next capacity tier\n\nRegion nests under
              each provider (see ProviderSpec.Regions) because a region name\nonly
              means something to one provider. It widens the candidate key to\n{provider,
              region, accelerator, capacityType} but does not change the order above.\n\nSo
              CapacityTypes is a HARD preference: every provider's Spot is tried before
              ANY\nprovider's OnDemand, even if some provider's on-demand were momentarily
              cheaper.\nStrategy only ranks providers within the active tier; it never
              crosses tiers.\n\nThe CEL rule below enforces that Weighted has a weight
              on every provider — a static\nproperty of the spec, so admission is
              the right place for it. The rule is currently\nUNREACHABLE (the Strategy
              enum admits only Ordered), kept so widening the enum\ncannot ship without
              its weight validation.\n(AWS once required at least one region here,
              because an omitted list meant \"the\nclient's default region\" and its
              client has none. Omitted now means \"every region\nthe provider serves\",
              which is a valid — if broad — AWS policy, so the rule is gone.\nSee
              ProviderSpec.Regions.)"
            properties:
              capacityTypes:
                default:
                - OnDemand
                - Spot
                description: |-
                  CapacityTypes is the OUTER axis: the purchase models to try, in fallback
                  order. e.g. [Spot, OnDemand] means "use spot on any provider first; only
                  when spot is exhausted everywhere, drop to on-demand". A single-element
                  list pins the pool to that type. This replaces a spot on/off flag.
                items:
                  description: |-
                    CapacityType is the purchase model (the outer axis). Each provider maps it to
                    its own concept — e.g. RunPod Spot -> interruptible/podRentInterruptable.
                  enum:
                  - Spot
                  - OnDemand
                  type: string
                minItems: 1
                type: array
              egress:
                description: |-
                  Egress restricts OUTBOUND connections from this pool's workloads; omitted means
                  Open. Inbound is never affected — a Blocked sandbox still serves its consumer's
                  tunnel and connect token, it just cannot call out.
                properties:
                  mode:
                    description: |-
                      Mode is required once spec.egress is set, so a half-written policy is rejected
                      rather than defaulted into a weaker one.
                    enum:
                    - Open
                    - Blocked
                    - Allowlist
                    type: string
                  targets:
                    description: |-
                      Targets is what mode Allowlist permits: CIDRs, bare IPs and domain names with an
                      optional wildcard, mixed in one list, e.g. ["10.0.0.0/8", "*.huggingface.co"].

                      One entry is exactly one target; the rule above rejects a comma, which appears in no
                      CIDR or hostname. Nothing joins this list into one string today, but a comma inside an
                      entry is meaningless to every provider that has to enforce it, and rejecting it here
                      keeps the next thing that renders the list from having to guess.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 64
                    type: array
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: targets is only valid with mode Allowlist
                  rule: self.mode == 'Allowlist' || !has(self.targets)
                - message: mode Allowlist requires at least one target; use mode Blocked
                    to permit nothing
                  rule: self.mode != 'Allowlist' || (has(self.targets) && self.targets.size()
                    > 0)
                - message: a target must not contain a comma; list each target as
                    its own entry
                  rule: '!has(self.targets) || self.targets.all(t, !t.contains('',''))'
              failover:
                description: |-
                  Failover controls how a provider that fails at provision time (e.g.
                  RunPod reports no capacity) is temporarily excluded and re-tried.
                properties:
                  blocklistTTL:
                    default: 30s
                    description: |-
                      BlocklistTTL is the BASE duration a failed placement is excluded before the
                      provider becomes a candidate for it again. The controller adds a random jitter
                      (up to 30s) on top so Pods that failed for the same reason do not all retry the
                      just-freed candidate in lockstep, so the effective exclusion is this value plus
                      that jitter.
                    type: string
                type: object
              providers:
                description: |-
                  Providers is the ordered set of NeoClouds this pool is allowed to use.
                  A Pod bound to this pool can only ever be placed on a provider in this
                  list. Order is significant only for the Ordered strategy (it is the
                  inner, provider-ranking axis). A pool can list at most 8 providers so the
                  candidate set remains bounded while larger configurations are unproven.
                items:
                  description: |-
                    ProviderSpec is one provider's entry in a pool: which provider, and the
                    per-provider placement policy (Weighted share, allowed regions). It is not a
                    mere reference — it carries config — so it is a Spec, not a Ref.
                  properties:
                    name:
                      description: |-
                        Name is the provider identifier, matching the ProviderLabel value on that
                        provider's virtual node (e.g. "runpod", "modal", "kubernetes").
                      type: string
                    regions:
                      description: |-
                        Regions CONSTRAINS where this provider may place, in the provider's own
                        vocabulary. It lives here per provider because region names are
                        provider-namespaced. Three levels:
                          - omitted/empty => every region the provider serves. For a region-simple
                            provider (Modal) this sends no region at all, its widest and cheapest mode.
                          - a geography GROUP token ("us", "eu", "ap", ...) => that geography's regions.
                            The recommended way to ask for breadth with a residency boundary.
                          - a literal region name ("us-east-1" on AWS, "us-east" on Modal) => just that.
                        Only the provider knows its own geography, so it resolves which level a value is
                        (see provider.Provider's ExpandRegions). Group tokens are shared across
                        providers; the regions behind them are not.

                        A non-group value is passed through UNVALIDATED, because region names change
                        faster than Nebula ships: a bad one fails at provision time with the provider's
                        own error, which beats refusing a region that launched last week. It is also the
                        escape hatch for AWS opt-in regions, which no group contains.

                        Unconstrained is the widest and costliest setting: every region becomes a
                        failover candidate and gets swept by the poll loop. Prefer a group unless the
                        workload needs global reach. Entry count is uncapped (a group already expands to
                        many); maxLength bounds each entry.
                      items:
                        maxLength: 32
                        type: string
                      type: array
                    weight:
                      description: |-
                        Weight is the relative share of new placements for the Weighted strategy.
                        Ignored by other strategies, which today means ignored entirely: Strategy
                        accepts only Ordered, so setting this has no effect until Weighted is enabled.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - name
                  type: object
                maxItems: 8
                minItems: 1
                type: array
              strategy:
                default: Ordered
                description: |-
                  Strategy is the INNER axis: how to rank providers within the active
                  capacity tier. It never overrides the capacity tier ordering.

                  Only Ordered is accepted today. LowestPrice and Weighted are defined as
                  constants (and the Weighted weight rule is already enforced above) but are
                  deliberately kept OUT of the enum until the ranking is implemented: admitting
                  a value the placement walk silently ignores would let a pool claim a policy it
                  does not get, which is worse than rejecting it at admission. Widening the enum
                  is the one change needed to enable them once selectPlacement ranks.
                enum:
                - Ordered
                type: string
            required:
            - providers
            type: object
            x-kubernetes-validations:
            - message: strategy Weighted requires a weight on every provider
              rule: self.strategy != 'Weighted' || self.providers.all(p, has(p.weight))
          status:
            description: NodePoolStatus surfaces the current placement picture for
              observability.
            properties:
              conditions:
                description: Conditions follows the standard Kubernetes condition
                  convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              placed:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  Placed counts existing instances per provider (booting included), for
                  at-a-glance balance.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
