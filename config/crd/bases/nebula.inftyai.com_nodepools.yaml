---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodepools.nebula.inftyai.com
spec:
  group: nebula.inftyai.com
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
    - np
    singular: nodepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.strategy
      name: Strategy
      type: string
    - jsonPath: .spec.providers[*].name
      name: Providers
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodePool is the placement policy for GPU workloads across NeoClouds.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "NodePoolSpec is the placement policy for a set of workloads.
              It is the\nlong-lived, user-facing object: editing it changes behaviour
              for every Pod\nthat selects the pool, without touching any workload.\n\nPlacement
              resolves along two orthogonal axes, and the ORDER between them is\nfixed:
              capacity type first, provider second.\n\n\tFOR each capacityType in
              CapacityTypes (in listed order):   // outer: hard tier\n\t    candidates
              = Providers x (each provider's Regions) x {this capacityType},\n\t                 available
              now, minus blocklist                // region nests per provider\n\t
              \   IF candidates non-empty:\n\t        pick one via Strategy (LowestPrice
              | Ordered | Weighted) // inner: rank candidates\n\t        DONE\n\t
              \   // else fall through to the next capacity tier\n\nRegion is a per-provider
              axis (see ProviderSpec.Regions), nested under each\nprovider because
              a region name only means something to one provider. It\nwidens the candidate
              key to {provider, region, accelerator, capacityType}\nwithout changing
              the tier-first ordering above.\n\nSo CapacityTypes is a hard preference:
              every provider's Spot is tried before\nANY provider's OnDemand. This
              is deliberate — \"spot everywhere before any\non-demand\" is the least
              surprising behaviour, even if a different provider's\non-demand were
              momentarily cheaper. Strategy only ranks providers *within*\nthe active
              capacity tier; it never crosses tiers.\n\nThe Weighted strategy requires
              a weight on every provider ref. This is a\nstatic property of the spec,
              so it is enforced at admission by the CEL rule\nbelow rather than surfaced
              as a status condition after the fact.\n(AWS once required at least one
              region here, because an omitted list meant \"the\nclient's default region\"
              and its client has none. Omitted now means \"every region\nthe provider
              serves\", which is a valid — if broad — AWS policy, so the rule is gone.\nSee
              ProviderSpec.Regions.)"
            properties:
              capacityTypes:
                default:
                - OnDemand
                - Spot
                description: |-
                  CapacityTypes is the OUTER axis: the purchase models to try, in fallback
                  order. e.g. [Spot, OnDemand] means "use spot on any provider first; only
                  when spot is exhausted everywhere, drop to on-demand". A single-element
                  list pins the pool to that type. This replaces a spot on/off flag.
                items:
                  description: |-
                    CapacityType is the purchase model (the outer axis). Each provider maps it to
                    its own concept — e.g. RunPod Spot -> interruptible/podRentInterruptable.
                  enum:
                  - Spot
                  - OnDemand
                  type: string
                minItems: 1
                type: array
              failover:
                description: |-
                  Failover controls how a provider that fails at provision time (e.g.
                  RunPod reports no capacity) is temporarily excluded and re-tried.
                properties:
                  blocklistTTL:
                    default: 30s
                    description: |-
                      BlocklistTTL is the BASE duration a failed placement is excluded before the
                      provider becomes a candidate for it again. The controller adds a random jitter
                      (up to 30s) on top so Pods that failed for the same reason do not all retry the
                      just-freed candidate in lockstep, so the effective exclusion is this value plus
                      that jitter.
                    type: string
                type: object
              providers:
                description: |-
                  Providers is the ordered set of NeoClouds this pool is allowed to use.
                  A Pod bound to this pool can only ever be placed on a provider in this
                  list. Order is significant only for the Ordered strategy (it is the
                  inner, provider-ranking axis). A pool can list at most 8 providers so the
                  candidate set remains bounded while larger configurations are unproven.
                items:
                  description: |-
                    ProviderSpec is one provider's entry in a pool: which provider, and the
                    per-provider placement policy (Weighted share, allowed regions). It is not a
                    mere reference — it carries config — so it is a Spec, not a Ref.
                  properties:
                    name:
                      description: |-
                        Name is the provider identifier, matching the ProviderLabel value on that
                        provider's virtual node (e.g. "runpod", "modal", "kubernetes").
                      type: string
                    regions:
                      description: |-
                        Regions constrains where this provider may place, in the provider's OWN
                        vocabulary. Region is provider-namespaced — there is no cross-provider region
                        vocabulary — so it lives here per provider, not on the pool. It is a
                        CONSTRAINT, not a list of regions to use, and it has three levels:
                          - omitted/empty => unconstrained: every region the provider serves. For a
                            region-simple provider (Modal) this means "send no region and let the
                            provider place freely", which is also its widest and cheapest mode.
                          - a geography GROUP token ("us", "eu", "ap", ...) => that geography's
                            regions. This is the recommended way to ask for breadth with a data
                            residency boundary.
                          - a literal region name ("us-east-1" on AWS, "us-east" on Modal) => exactly
                            that region.
                        The provider resolves which level a value is, since only it knows its own
                        geography (see provider.Provider's ExpandRegions). Group tokens are shared
                        across providers but the regions behind them are not: "eu" is eu-west-1 and
                        friends on AWS, while London is eu-west-2 there and there is no "uk" group.

                        A value that is not a group token is passed to the provider UNVALIDATED.
                        Region names change faster than Nebula ships, so an unrecognized one is
                        forwarded rather than rejected: a genuinely bad name fails at provision time
                        with the provider's own error, which is better than refusing a region that
                        launched last week. It is also the escape hatch for AWS opt-in regions, which
                        no group contains.

                        Unconstrained on a region-aware provider is the widest setting and costs
                        something: every region becomes a placement candidate to walk on failover, and
                        every region is swept by the observability poll loop. Prefer a group unless the
                        workload genuinely needs global reach. There is no cap on the number of entries
                        (a group already expands to many, so capping the declaration would be
                        arbitrary); maxLength bounds each entry.
                      items:
                        maxLength: 32
                        type: string
                      type: array
                    weight:
                      description: |-
                        Weight is the relative share of new placements for the Weighted strategy.
                        Ignored by other strategies.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - name
                  type: object
                maxItems: 8
                minItems: 1
                type: array
              strategy:
                default: Ordered
                description: |-
                  Strategy is the INNER axis: how to rank providers within the active
                  capacity tier. It never overrides the capacity tier ordering.
                enum:
                - LowestPrice
                - Ordered
                - Weighted
                type: string
            required:
            - providers
            type: object
            x-kubernetes-validations:
            - message: strategy Weighted requires a weight on every provider
              rule: self.strategy != 'Weighted' || self.providers.all(p, has(p.weight))
          status:
            description: NodePoolStatus surfaces the current placement picture for
              observability.
            properties:
              conditions:
                description: Conditions follows the standard Kubernetes condition
                  convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              placed:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  Placed counts existing instances per provider (booting included), for
                  at-a-glance balance.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
